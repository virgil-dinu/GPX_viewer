<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GPX Viewer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:rgba(14,17,24,.82);--fg:#e8ecf4;--mut:#8a93a6;--acc:#4de0c4;--bd:rgba(255,255,255,.1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0b0d12;color:var(--fg)}
#map{position:absolute;inset:0}
.glass{position:absolute;z-index:1000;background:var(--bg);backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
#panel{top:16px;left:16px;width:320px;padding:18px;max-height:calc(100% - 32px);overflow:auto}
h1{margin:0 0 14px;font-size:15px;letter-spacing:.18em;text-transform:uppercase;font-weight:700}
h1 span{color:var(--acc)}
#drop{border:1.5px dashed var(--bd);border-radius:12px;padding:22px 12px;text-align:center;color:var(--mut);cursor:pointer;transition:.2s;font-size:13px}
#drop:hover,#drop.on{border-color:var(--acc);color:var(--acc);background:rgba(77,224,196,.06)}
#drop b{display:block;color:var(--fg);font-size:14px;margin-bottom:4px}
#name{margin:14px 0 4px;font-weight:600;font-size:14px;word-break:break-word}
#stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.st{background:rgba(255,255,255,.04);border:1px solid var(--bd);border-radius:10px;padding:9px 11px}
.st small{display:block;color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:.1em}
.st strong{font-size:17px;font-variant-numeric:tabular-nums}
.row{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.lbl{width:100%;color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:.1em;margin-top:4px}
button{flex:1;background:rgba(255,255,255,.05);color:var(--fg);border:1px solid var(--bd);border-radius:9px;padding:8px 6px;font:inherit;font-size:12px;cursor:pointer;transition:.15s}
button:hover{border-color:var(--acc)}
button.on{background:var(--acc);color:#07120f;border-color:var(--acc);font-weight:600}
#legend{height:8px;border-radius:4px;margin-top:10px;background:linear-gradient(90deg,hsl(240,85%,55%),hsl(180,85%,50%),hsl(120,85%,50%),hsl(60,90%,52%),hsl(0,85%,55%))}
#lg{display:flex;justify-content:space-between;color:var(--mut);font-size:10px;margin-top:3px}
#prof{left:352px;right:16px;bottom:16px;height:150px;padding:8px;display:none}
#prof canvas{width:100%;height:100%;display:block;cursor:crosshair}
#tip{position:absolute;z-index:1001;pointer-events:none;background:#000c;border:1px solid var(--bd);border-radius:8px;padding:5px 8px;font-size:11px;display:none;white-space:nowrap}
.dot{width:14px;height:14px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 12px currentColor}
.pulse{width:18px;height:18px;border-radius:50%;background:#fff;border:4px solid var(--acc);box-shadow:0 0 0 0 rgba(77,224,196,.7);animation:p 1.6s infinite}
@keyframes p{to{box-shadow:0 0 0 16px rgba(77,224,196,0)}}
.leaflet-container{background:#0b0d12}
@media(max-width:760px){#panel{width:calc(100% - 32px)}#prof{left:16px}}
</style>
</head>
<body>
<div id="map"></div>
<div id="tip"></div>
<div id="panel" class="glass">
  <h1>GPX <span>Viewer</span></h1>
  <div id="drop"><b>Choisir ou déposer un fichier .gpx</b>Glisser-déposer accepté</div>
  <input id="file" type="file" accept=".gpx,application/gpx+xml,text/xml" hidden>
  <div id="info" style="display:none">
    <div id="name"></div>
    <div id="stats"></div>
    <div class="row"><span class="lbl">Coloration</span>
      <button data-m="ele" class="on">Altitude</button><button data-m="slope">Pente</button><button data-m="speed">Vitesse</button>
    </div>
    <div id="legend"></div><div id="lg"><span id="l0"></span><span id="l1"></span></div>
    <div class="row"><span class="lbl">Fond</span>
      <button data-t="dark" class="on">Sombre</button><button data-t="sat">Satellite</button><button data-t="topo">Topo</button>
    </div>
    <div class="row"><button id="play">Lecture</button><button id="fit">Recentrer</button></div>
  </div>
</div>
<div id="prof" class="glass"><canvas id="cv"></canvas></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const $=s=>document.querySelector(s);
const map=L.map('map',{zoomControl:false,preferCanvas:true}).setView([46.6,2.4],6);
L.control.zoom({position:'topright'}).addTo(map);
const tiles={
  dark:L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19,attribution:'© OpenStreetMap © CARTO'}),
  sat:L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri'}),
  topo:L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'© OpenTopoMap'})
};
let curTile=tiles.dark.addTo(map);
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x===b));
  map.removeLayer(curTile);curTile=tiles[b.dataset.t].addTo(map);curTile.bringToBack();
});

let P=[],layer=L.layerGroup().addTo(map),cursor=null,mode='ele',bounds=null,anim=null,stats={};

const drop=$('#drop'),inp=$('#file');
drop.onclick=()=>inp.click();
inp.onchange=()=>inp.files[0]&&load(inp.files[0]);
['dragover','dragenter'].forEach(e=>window.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('on')}));
['dragleave','drop'].forEach(e=>window.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('on')}));
window.addEventListener('drop',ev=>ev.dataTransfer.files[0]&&load(ev.dataTransfer.files[0]));

function load(f){const r=new FileReader();r.onload=()=>parse(r.result,f.name);r.readAsText(f)}

function hav(a,b){const R=6371000,t=Math.PI/180,dl=(b.lat-a.lat)*t,dn=(b.lon-a.lon)*t;
  const x=Math.sin(dl/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}

function parse(txt,fname){
  const d=new DOMParser().parseFromString(txt,'application/xml');
  if(d.querySelector('parsererror')){alert('GPX invalide');return}
  let nodes=[...d.getElementsByTagNameNS('*','trkpt')];
  if(!nodes.length)nodes=[...d.getElementsByTagNameNS('*','rtept')];
  if(nodes.length<2){alert('Aucun point de trace trouvé');return}
  P=nodes.map(n=>{
    const e=n.getElementsByTagNameNS('*','ele')[0],t=n.getElementsByTagNameNS('*','time')[0];
    return{lat:+n.getAttribute('lat'),lon:+n.getAttribute('lon'),ele:e?+e.textContent:null,t:t?Date.parse(t.textContent):null}
  }).filter(p=>isFinite(p.lat)&&isFinite(p.lon));
  const nm=d.getElementsByTagNameNS('*','name')[0];
  const wpts=[...d.getElementsByTagNameNS('*','wpt')].map(w=>({lat:+w.getAttribute('lat'),lon:+w.getAttribute('lon'),n:(w.getElementsByTagNameNS('*','name')[0]||{}).textContent||''}));
  compute();render(wpts);
  $('#name').textContent=(nm&&nm.textContent.trim())||fname;
  $('#info').style.display='block';$('#prof').style.display='block';
  drop.innerHTML='<b>Charger un autre fichier</b>.gpx';
  setMode(hasEle()?'ele':'slope');
  setTimeout(()=>{map.invalidateSize();drawProfile()},50);
}

const hasEle=()=>P.some(p=>p.ele!=null);
const hasTime=()=>P[0].t!=null&&P[P.length-1].t!=null;

function compute(){
  let c=0,up=0,dn=0,ref=null;
  P.forEach((p,i)=>{
    if(i)c+=hav(P[i-1],p);p.d=c;
    if(p.ele!=null){
      if(ref==null)ref=p.ele;
      const df=p.ele-ref;
      if(df>=3){up+=df;ref=p.ele}else if(df<=-3){dn-=df;ref=p.ele}
    }
  });
  // pente et vitesse lissées sur fenêtre
  const W=Math.max(2,Math.round(P.length/300));
  P.forEach((p,i)=>{
    const a=P[Math.max(0,i-W)],b=P[Math.min(P.length-1,i+W)],dd=b.d-a.d;
    p.slope=(dd>0&&a.ele!=null&&b.ele!=null)?(b.ele-a.ele)/dd*100:0;
    p.speed=(a.t!=null&&b.t!=null&&b.t>a.t)?dd/((b.t-a.t)/1000)*3.6:0;
  });
  const el=P.map(p=>p.ele).filter(v=>v!=null);
  const dur=hasTime()?(P[P.length-1].t-P[0].t)/1000:null;
  stats={dist:c,up,dn,min:el.length?Math.min(...el):null,max:el.length?Math.max(...el):null,dur};
  const S=[['Distance',(c/1000).toFixed(2)+' km'],['Points',P.length.toLocaleString('fr-FR')]];
  if(el.length)S.push(['Dénivelé +',Math.round(up)+' m'],['Dénivelé −',Math.round(dn)+' m'],['Alt. min',Math.round(stats.min)+' m'],['Alt. max',Math.round(stats.max)+' m']);
  if(dur){const h=Math.floor(dur/3600),m=Math.floor(dur%3600/60);
    S.push(['Durée',h+'h'+String(m).padStart(2,'0')],['Vit. moy.',(c/dur*3.6).toFixed(1)+' km/h'])}
  $('#stats').innerHTML=S.map(s=>`<div class="st"><small>${s[0]}</small><strong>${s[1]}</strong></div>`).join('');
}

function val(p){return mode==='ele'?p.ele:mode==='slope'?p.slope:p.speed}
function range(){
  if(mode==='slope')return[-15,15];
  const v=P.map(val).filter(x=>x!=null&&isFinite(x)).sort((a,b)=>a-b);
  if(!v.length)return[0,1];
  return[v[Math.floor(v.length*.02)],v[Math.floor(v.length*.98)]||v[v.length-1]];
}
function col(v,[lo,hi]){
  if(v==null)return'#4de0c4';
  const t=Math.min(1,Math.max(0,(v-lo)/((hi-lo)||1)));
  return`hsl(${(1-t)*240},85%,${52+Math.sin(t*Math.PI)*0}%)`;
}

function render(wpts){
  layer.clearLayers();stopAnim();
  const ll=P.map(p=>[p.lat,p.lon]);
  bounds=L.latLngBounds(ll);
  layer.addLayer(L.polyline(ll,{color:'#000',weight:9,opacity:.55,lineCap:'round',lineJoin:'round',interactive:false}));
  const step=Math.ceil(P.length/3000);
  window._seg=[];
  for(let i=0;i<P.length-1;i+=step){
    const j=Math.min(i+step,P.length-1);
    const s=L.polyline([ll[i],ll[j]],{weight:5,lineCap:'round',interactive:false});
    s._i=i;s._j=j;layer.addLayer(s);window._seg.push(s);
  }
  const mk=(p,c)=>L.marker([p.lat,p.lon],{icon:L.divIcon({className:'',html:`<div class="dot" style="background:${c};color:${c}"></div>`,iconSize:[14,14],iconAnchor:[7,7]})}).addTo(layer);
  mk(P[0],'#3ddc84');mk(P[P.length-1],'#ff4d5e');
  wpts.forEach(w=>L.circleMarker([w.lat,w.lon],{radius:6,color:'#fff',weight:2,fillColor:'#ffb020',fillOpacity:1}).bindTooltip(w.n||'Waypoint').addTo(layer));
  cursor=L.marker(ll[0],{icon:L.divIcon({className:'',html:'<div class="pulse"></div>',iconSize:[18,18],iconAnchor:[9,9]}),interactive:false,zIndexOffset:1000}).addTo(map);
  map.fitBounds(bounds,{padding:[60,60],paddingTopLeft:[360,60],paddingBottomRight:[60,200]});
}

function recolor(){
  const r=range();
  window._seg.forEach(s=>s.setStyle({color:col(val(P[s._i]),r)}));
  const f=mode==='ele'?v=>Math.round(v)+' m':mode==='slope'?v=>v.toFixed(0)+' %':v=>v.toFixed(0)+' km/h';
  $('#l0').textContent=f(r[0]);$('#l1').textContent=f(r[1]);
}
function setMode(m){
  if(m==='ele'&&!hasEle())m='slope';
  if(m==='speed'&&!hasTime())m=hasEle()?'ele':'slope';
  mode=m;
  document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  recolor();drawProfile();
}
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>P.length&&setMode(b.dataset.m));
$('#fit').onclick=()=>bounds&&map.fitBounds(bounds,{padding:[60,60],paddingTopLeft:[360,60],paddingBottomRight:[60,200]});

// Profil
const cv=$('#cv'),cx=cv.getContext('2d');let hoverI=null;
function drawProfile(){
  if(!P.length)return;
  const r=cv.getBoundingClientRect(),dpr=devicePixelRatio||1;
  cv.width=r.width*dpr;cv.height=r.height*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  const W=r.width,H=r.height,m={l:38,r:8,t:8,b:18};
  const useE=hasEle();
  const ys=P.map(p=>useE?p.ele:p.speed),vmin=Math.min(...ys.filter(v=>v!=null)),vmax=Math.max(...ys.filter(v=>v!=null));
  const X=d=>m.l+d/stats.dist*(W-m.l-m.r),Y=v=>H-m.b-(v-vmin)/((vmax-vmin)||1)*(H-m.t-m.b);
  cx.clearRect(0,0,W,H);
  cx.font='10px system-ui';cx.fillStyle='#8a93a6';cx.strokeStyle='rgba(255,255,255,.06)';
  for(let k=0;k<=3;k++){const v=vmin+(vmax-vmin)*k/3,y=Y(v);cx.beginPath();cx.moveTo(m.l,y);cx.lineTo(W-m.r,y);cx.stroke();cx.fillText(Math.round(v),2,y+3)}
  cx.fillText('0',m.l,H-4);cx.fillText((stats.dist/1000).toFixed(1)+' km',W-m.r-40,H-4);
  const r2=range(),n=P.length,st=Math.max(1,Math.floor(n/W));
  for(let i=0;i<n-1;i+=st){
    const j=Math.min(i+st,n-1),a=P[i],b=P[j];
    if(ys[i]==null||ys[j]==null)continue;
    cx.fillStyle=col(val(a),r2);cx.globalAlpha=.85;
    cx.beginPath();cx.moveTo(X(a.d),H-m.b);cx.lineTo(X(a.d),Y(ys[i]));cx.lineTo(X(b.d),Y(ys[j]));cx.lineTo(X(b.d),H-m.b);cx.fill();
  }
  cx.globalAlpha=1;
  if(hoverI!=null){const p=P[hoverI],x=X(p.d);cx.strokeStyle='#fff';cx.beginPath();cx.moveTo(x,m.t);cx.lineTo(x,H-m.b);cx.stroke();
    if(ys[hoverI]!=null){cx.fillStyle='#fff';cx.beginPath();cx.arc(x,Y(ys[hoverI]),4,0,7);cx.fill()}}
  cv._m=m;cv._W=W;
}
function idxAt(d){let lo=0,hi=P.length-1;while(lo<hi){const mid=(lo+hi)>>1;P[mid].d<d?lo=mid+1:hi=mid}return lo}
function focus(i){
  hoverI=i;const p=P[i];cursor.setLatLng([p.lat,p.lon]);drawProfile();
  const tip=$('#tip');tip.style.display='block';
  let t=(p.d/1000).toFixed(2)+' km';
  if(p.ele!=null)t+=' · '+Math.round(p.ele)+' m';
  t+=' · '+p.slope.toFixed(1)+' %';
  if(hasTime())t+=' · '+p.speed.toFixed(1)+' km/h';
  tip.textContent=t;
}
cv.addEventListener('mousemove',e=>{
  stopAnim();
  const r=cv.getBoundingClientRect(),m=cv._m,x=e.clientX-r.left;
  const d=Math.min(1,Math.max(0,(x-m.l)/(cv._W-m.l-m.r)))*stats.dist;
  focus(idxAt(d));
  const tip=$('#tip');tip.style.left=Math.min(innerWidth-tip.offsetWidth-8,e.clientX+12)+'px';tip.style.top=(r.top-34)+'px';
});
cv.addEventListener('mouseleave',()=>{$('#tip').style.display='none';hoverI=null;drawProfile()});
addEventListener('resize',drawProfile);

// Lecture animée
function stopAnim(){if(anim){cancelAnimationFrame(anim);anim=null;$('#play').textContent='Lecture';$('#play').classList.remove('on')}}
$('#play').onclick=()=>{
  if(anim){stopAnim();return}
  $('#play').textContent='Pause';$('#play').classList.add('on');
  const T=15000;let t0=performance.now(),start=hoverI&&hoverI<P.length-2?P[hoverI].d/stats.dist:0;
  const f=now=>{
    const k=start+(now-t0)/T*(1-start);
    if(k>=1){focus(P.length-1);stopAnim();return}
    const i=idxAt(k*stats.dist);focus(i);
    if(!map.getBounds().pad(-.15).contains(cursor.getLatLng()))map.panTo(cursor.getLatLng(),{animate:true,duration:.4});
    anim=requestAnimationFrame(f);
  };
  anim=requestAnimationFrame(f);
};
</script>
</body>
</html>
